name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git make perl xz-utils zip unzip python3 \
            python3-pil libtinfo6 libncurses6 libplist-utils

      - name: Install ldid
        run: |
          curl -L -o /tmp/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64"
          sudo install -m 0755 /tmp/ldid /usr/local/bin/ldid
          ldid 2>&1 | head -1 || true

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-iphoneos16.5-v1

      - name: Install Theos, iOS toolchain and SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth=1 https://github.com/theos/theos.git theos
          ARCH=$(uname -m)
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            | tar xJ -C theos/toolchain
          mkdir -p theos/sdks
          curl -L "https://github.com/theos/sdks/archive/master.tar.gz" -o /tmp/sdk.tar.gz
          tar -xf /tmp/sdk.tar.gz -C /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk theos/sdks/
          test -x theos/toolchain/linux/iphone/bin/clang
          test -d theos/sdks/iPhoneOS16.5.sdk

      - name: Build IPA
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          export TC="$THEOS/toolchain/linux/iphone/bin"
          export SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -x "$TC/clang"
          test -d "$SDK"
          chmod +x build.sh
          ./build.sh
          ls -la *.ipa

      - name: Upload IPA as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: "*.ipa"
          fail_on_unmatched_files: true
          generate_release_notes: false
